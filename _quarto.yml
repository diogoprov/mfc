project:
  type: website
  output-dir: docs
  resources:
    - slides/*.pdf
  render:
    - "*.qmd"
    - "aula-*/*.qmd"
    - "slides/*.qmd"
    - "!README.md"
    - "!CLAUDE.md"
    - "!PLANO-conversao-qmd.md"
    - "!PLANO-livro-quarto.md"
    - "!inventarios/"
    - "!ferramentas/"

website:
  title: "Métodos Filogenéticos Comparativos"
  description: "Disciplina de pós-graduação em Biologia Animal (UFMS) — métodos filogenéticos comparativos em R."
  site-url: "https://provetelab.org/mfc/"
  favicon: favicon.png
  open-graph: true

  repo-url: "https://github.com/diogoprov/mfc"

  navbar:
    background: light
    pinned: true
    collapse-below: lg
    title: "Métodos Filogenéticos Comparativos"
    left:
      - href: index.qmd
        text: Início
      - href: comece-aqui.qmd
        text: Comece aqui
      - href: programa.qmd
        text: Programa
      - text: Aulas
        menu:
          - href: aula-01-arvore-dados/index.qmd
            text: "1 · A árvore e os dados"
          - href: aula-02-bm-matriz-c/index.qmd
            text: "2 · O BM e a matriz C"
          - href: aula-03-sinal/index.qmd
            text: "3 · Sinal filogenético"
          - href: aula-04-modelos/index.qmd
            text: "4 · Modelos contínuos"
          - href: aula-05-pgls/index.qmd
            text: "5 · PGLS"
          - href: aula-06-discretos/index.qmd
            text: "6 · Atributos discretos"
          - href: aula-07-ancestrais/index.qmd
            text: "7 · Estados ancestrais"
          - href: aula-08-multivariados/index.qmd
            text: "8 · Atributos multivariados"
      - text: Estudar
        menu:
          - href: praticas.qmd
            text: Roteiros práticos
          - href: glossario.qmd
            text: Glossário
    right:
      - icon: github
        href: "https://github.com/diogoprov/mfc"
        aria-label: GitHub
      - icon: house-door
        href: "https://provetelab.org/"
        aria-label: Biodiversity Synthesis Lab

  page-footer:
    background: light
    left: |
      © Diogo B. Provete · Biodiversity Synthesis Lab · Instituto de Biociências, UFMS
    center: |
      Conteúdo sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br), exceto onde indicado
    right: |
      Built with [Quarto](https://quarto.org).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

knitr:
  opts_chunk:
    dev.args:
      bg: "#faf7f0"

lang: pt

# Os slides têm chunks de R que geram as figuras. Com freeze, o resultado
# fica em _freeze/ (versionado) e o CI renderiza só com o Quarto, sem os
# pacotes de filogenética. Depois de mudar um .qmd com código ou uma
# função em R/, rode `quarto render` localmente e commite _freeze/ junto.
execute:
  freeze: auto

editor: source
