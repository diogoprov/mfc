project:
  type: website
  output-dir: docs
  resources:
    - slides/*.pdf
  render:
    - "*.qmd"
    - "aula-*/*.qmd"
    - "slides/*.qmd"
    - "!README.md"
    - "!CLAUDE.md"
    - "!PLANO-conversao-qmd.md"
    - "!inventarios/"

website:
  title: "Métodos Filogenéticos Comparativos"
  description: "Disciplina de pós-graduação em Biologia Animal (UFMS) — métodos filogenéticos comparativos em R."
  site-url: "https://provetelab.org/mfc/"
  favicon: favicon.png
  open-graph: true

  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Início
    right:
      - text: "Biodiversity Synthesis Lab"
        href: "https://provetelab.org/"
      - icon: github
        href: "https://github.com/diogoprov/mfc"
        aria-label: GitHub

  page-footer:
    background: light
    left: |
      Diogo B. Provete · Instituto de Biociências, UFMS
    right: |
      Voltar ao [site do laboratório](https://provetelab.org/).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

lang: pt

# Os slides têm chunks de R que geram as figuras. Com freeze, o resultado
# fica em _freeze/ (versionado) e o CI renderiza só com o Quarto, sem os
# pacotes de filogenética. Depois de mudar um .qmd com código ou uma
# função em R/, rode `quarto render` localmente e commite _freeze/ junto.
execute:
  freeze: auto

editor: source
